<div class="chat-container" 
     [class.collapsed]="isCollapsed"
     role="log" 
     aria-live="polite" 
     aria-label="Conversation history">
  
  <!-- Collapsed view - shows only most recent message -->
  <div class="collapsed-content" *ngIf="isCollapsed && messages.length > 0">
    <div class="most-recent-message">
      <div class="message-wrapper"
           [class.user-message]="messages[messages.length - 1].sender === 'user'"
           [class.ai-message]="messages[messages.length - 1].sender === 'ai'">
        <div class="message-bubble"
             [class.user-bubble]="messages[messages.length - 1].sender === 'user'"
             [class.ai-bubble]="messages[messages.length - 1].sender === 'ai'">
          <p class="message-text" [innerHTML]="messages[messages.length - 1].text | markdown"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Expanded view - shows all messages -->
  <div class="messages-list" *ngIf="!isCollapsed">
    <div *ngFor="let message of messages" 
         class="message-wrapper"
         [class.user-message]="message.sender === 'user'"
         [class.ai-message]="message.sender === 'ai'"
         role="article"
         [attr.aria-label]="message.sender === 'user' ? 'Your message' : 'AI assistant message'">
      
      <div class="message-bubble"
           [class.user-bubble]="message.sender === 'user'"
           [class.ai-bubble]="message.sender === 'ai'">
        <p class="message-text" [innerHTML]="message.text | markdown"></p>
      </div>

      <!-- Clarifier prompt — below AI message bubble, before hotel results -->
      <app-clarifier-prompt
        *ngIf="message.sender === 'ai' && message.clarifier"
        [text]="message.clarifier.text"
        [chips]="message.clarifier.chips"
        (chosen)="clarifierChosen.emit($event)">
      </app-clarifier-prompt>

      <!-- Suggested reply chips — directly below AI text, above results -->
      <div
        *ngIf="message.sender === 'ai' && message.suggestedReplies && message.suggestedReplies.length > 0"
        class="reply-chips"
        role="list"
        aria-label="Quick reply options"
      >
        <button
          *ngFor="let reply of message.suggestedReplies"
          type="button"
          class="reply-chip"
          role="listitem"
          (click)="onReplyChipClick(reply)"
        >
          {{ reply }}
        </button>
      </div>

      <!-- Room cards (shown inline for all layouts when message has rooms) -->
      <div *ngIf="message.sender === 'ai' && message.rooms && message.rooms.length > 0"
           class="inline-rooms"
           role="region"
           aria-label="Available room types">
        <div class="inline-rooms-container">
          <app-room-card
            *ngFor="let room of message.rooms"
            [room]="room">
          </app-room-card>
        </div>
      </div>

      <!-- Date picker button for small result sets (show BEFORE hotel cards on desktop) -->
      <div *ngIf="message.sender === 'ai' && !isMobile && message.showDatePicker && !isDatePickerVisible(message.id) && isLatestHotelMessage(message)" 
           class="date-picker-prompt">
        <p *ngIf="getDatePromptMessage(message)" class="date-prompt-text">{{ getDatePromptMessage(message) }}</p>
        <button class="select-dates-button" 
                (click)="onSelectDatesClick(message.id)"
                aria-label="Open date picker to select check-in and check-out dates">
          Select Dates
        </button>
      </div>

      <!-- Inline hotel cards for mobile (all messages) -->
      <div *ngIf="message.sender === 'ai' && isMobile && message.hotels && message.hotels.length > 0" 
           class="inline-hotels"
           role="region"
           aria-label="Hotel search results">
        <app-search-summary
          *ngIf="message.searchContext"
          [context]="message.searchContext">
        </app-search-summary>
        <div class="inline-hotels-container">
          <app-hotel-card
            *ngFor="let hotel of getInlineHotels(message)"
            [hotel]="hotel"
            [variant]="'mobile'"
            [vm]="getVmFor(message, hotel)"
            (cardClicked)="onCardClick($event)">
          </app-hotel-card>
          <!-- See all results card -->
          <button *ngIf="message.hotels && message.hotels.length > 3" 
                  class="see-all-card" 
                  (click)="onViewAllClick()"
                  aria-label="See all results on map">
            <span class="see-all-text">See all results</span>
            <i class="ph ph-arrow-right see-all-arrow" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Refinement chips — below inline hotel cards, latest hotel message only -->
      <app-refinement-chips
        *ngIf="message.sender === 'ai' && message.refinementChips?.length && isLatestHotelMessage(message)"
        [chips]="message.refinementChips!"
        (picked)="refinementPicked.emit($event)">
      </app-refinement-chips>

      <!-- Action buttons for mobile: View All on Map (secondary, left) + Select Dates (primary, right) -->
      <div *ngIf="message.sender === 'ai' && isMobile && message.hotels && message.hotels.length > 0 && isLatestHotelMessage(message)" 
           class="action-buttons-container">
        <button class="view-all-button secondary" 
                (click)="onViewAllClick()" 
                aria-label="View all hotels on map">
          View All on Map
        </button>
        <button *ngIf="message.showDatePicker && !isDatePickerVisible(message.id)"
                class="select-dates-button primary" 
                (click)="onSelectDatesClick(message.id)"
                aria-label="Open date picker to select check-in and check-out dates">
          Select Dates
        </button>
      </div>

      <!-- Date picker component -->
      <div *ngIf="message.sender === 'ai' && isDatePickerVisible(message.id)" 
           class="date-picker-container">
        <app-date-picker
          [visible]="true"
          (datesSelected)="onDatesSelected($event)"
          (cancelled)="onDatePickerCancelled()">
        </app-date-picker>
      </div>

      <!-- Rate calendar component -->
      <div *ngIf="message.sender === 'ai' && message.showRateCalendar && message.rateCalendarHotel" 
           class="rate-calendar-container">
        <app-rate-calendar
          [visible]="true"
          [inline]="true"
          [hotel]="message.rateCalendarHotel"
          [basePrice]="message.rateCalendarHotel.pricing.nightlyRate"
          (dateSelected)="onRateCalendarDatesSelected($event)"
          (closed)="onRateCalendarClosed()">
        </app-rate-calendar>
      </div>

    </div>

    <!-- Thinking animation -->
    <div *ngIf="isThinking" class="message-wrapper ai-message" role="status" aria-live="polite" aria-label="AI is thinking">
      <app-thinking-animation [visible]="true"></app-thinking-animation>
    </div>
  </div>
</div>
