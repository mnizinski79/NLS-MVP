<form (submit)="onSubmit($event)" class="input-wrapper" role="search">
  <label for="chat-input" class="sr-only">Search for hotels</label>

  <div class="input-pill" [class.has-chips]="activeChips.length > 0">

    <!-- Input row — send button lives here when there are no chips -->
    <div class="input-row">
      <input
        id="chat-input"
        type="text"
        inputmode="text"
        [(ngModel)]="inputValue"
        [ngModelOptions]="{standalone: true}"
        [placeholder]="placeholder"
        [disabled]="disabled"
        class="input-field"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
        enterkeyhint="send"
        aria-label="Search for hotels in New York City"
        aria-describedby="input-help"
      />
      <button
        *ngIf="activeChips.length === 0"
        type="submit"
        [disabled]="disabled || !inputValue.trim()"
        class="send-button"
        [class.has-text]="inputValue.trim()"
        aria-label="Send message"
        [attr.aria-disabled]="disabled || !inputValue.trim()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="send-icon" aria-hidden="true">
          <path d="M11 20V7.83l-5.59 5.58L4 12l8-8 8 8-1.41 1.41L13 7.83V20h-2z"/>
        </svg>
      </button>
    </div>

    <!-- Footer row — chips + send button, only shown when chips are present -->
    <div class="input-footer" *ngIf="activeChips.length > 0">
      <div class="chips-row" role="list" aria-label="Active filters">
        <button
          *ngFor="let chip of activeChips"
          type="button"
          class="trip-chip"
          role="listitem"
          [attr.aria-label]="'Remove filter: ' + chip.label"
          (click)="onChipRemoved(chip)"
        >
          <span class="chip-label">{{ chip.label }}</span>
          <span class="chip-remove" aria-hidden="true">✕</span>
        </button>
      </div>

      <button
        type="submit"
        [disabled]="disabled || !inputValue.trim()"
        class="send-button"
        [class.has-text]="inputValue.trim()"
        aria-label="Send message"
        [attr.aria-disabled]="disabled || !inputValue.trim()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="send-icon" aria-hidden="true">
          <path d="M11 20V7.83l-5.59 5.58L4 12l8-8 8 8-1.41 1.41L13 7.83V20h-2z"/>
        </svg>
      </button>
    </div>

  </div>

  <span id="input-help" class="sr-only">Enter your hotel search query and press send or enter</span>
</form>
